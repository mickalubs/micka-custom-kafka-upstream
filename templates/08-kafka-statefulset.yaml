apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{.Values.kafka.statefulset.name}}
  namespace: {{.Values.kafka.namespace.name}}
spec:
  serviceName: {{.Values.kafka.headless_service.name}}
  replicas: {{.Values.kafka.statefulset.replicas}}
  selector:
    matchLabels:
      app: {{.Values.kafka.labels.name}}
  updateStrategy:
    type: {{.Values.kafka.statefulset.updateStrategy}}
  podManagementPolicy: {{.Values.kafka.statefulset.podManagementPolicy}}
  template:
    metadata: 
      labels:
        app: {{.Values.kafka.labels.name}} 
        deployment: {{.Values.kafka.labels.deployment}}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{.Values.kafka.labels.name}}
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-zookeeper
          image: {{.Values.kafka.statefulset.initContainers.image.name}}:{{.Values.kafka.statefulset.initContainers.image.version}}
          command:
            - /bin/sh
            - -c
            - |
              until nc -z {{.Values.zookeeper.client_service.name}}.{{.Values.kafka.labels.name}}.svc.{{.Values.cluster.name}} 2181;
              do sleep 5; done
      containers:
        - name: {{.Values.kafka.labels.name}}
          image: {{.Values.kafka.container.image.name}}:{{.Values.kafka.container.image.version}}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BROKER_ID_COMMAND
              value: "echo ${HOSTNAME##*-}"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: >-
                {{.Values.zookeeper.client_service.name}}.{{.Values.kafka.labels.name}}.svc.{{.Values.cluster.name}}:2181
            - name: KAFKA_LISTENERS
              value: INTERNAL://0.0.0.0:{{.Values.kafka.port.internal.port}},EXTERNAL://0.0.0.0:{{.Values.kafka.port.external.port}}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: >-
                INTERNAL://$(POD_NAME).{{.Values.kafka.headless_service.name}}.{{.Values.kafka.labels.name}}.svc.{{.Values.cluster.name}}:{{.Values.kafka.port.internal.port}},
                EXTERNAL://$(POD_NAME).{{.Values.kafka.headless_service.name}}.{{.Values.kafka.labels.name}}.svc.{{.Values.cluster.name}}:{{.Values.kafka.port.external.port}}
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_LOG_DIRS
              value: /var/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512M -Xmx512M"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/kafka/data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: {{.Values.kafka.port.external.port}}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{.Values.kafka.port.external.port}}
            initialDelaySeconds: 60
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
